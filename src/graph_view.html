<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>edict graph</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #c9c9c3;
    --edge: #9a9a93; --cycle: #d63c2f; --violation: #e08a00; --out: #2463eb; --in: #8a3ffc;
    --focus: #1d1d1b; --chip: #ececE8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151513; --panel: #1f1f1c; --ink: #ededE8; --muted: #9b9b94; --line: #3a3a36;
      --edge: #6c6c66; --cycle: #ff6b5e; --violation: #ffb340; --out: #6b9bff; --in: #b78cff;
      --focus: #ededE8; --chip: #2b2b27;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 3; display: flex; gap: 8px; align-items: center;
    padding: 10px 12px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #bar h1 { font-size: 15px; margin: 0 6px 0 0; font-weight: 650; white-space: nowrap; }
  #bar h1 span { color: var(--muted); font-weight: 450; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button, .btn { border: 0; background: var(--panel); color: var(--ink); padding: 6px 10px; font: inherit; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--ink); color: var(--bg); }
  .btn { border: 1px solid var(--line); border-radius: 8px; }
  .btn.on { background: var(--ink); color: var(--bg); }
  #search { flex: 1 1 140px; min-width: 120px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit; }
  #stats { color: var(--muted); font-size: 12px; white-space: nowrap; }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  svg.dragging { cursor: grabbing; }
  .node rect.box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; rx: 7; }
  .node .band { stroke: none; }
  .node text { fill: var(--ink); font-size: 12px; pointer-events: none; }
  .node text.sub { fill: var(--muted); font-size: 10px; }
  .node.cycle rect.box { stroke: var(--cycle); stroke-width: 2; }
  .node.match rect.box { stroke: var(--focus); stroke-width: 2.5; stroke-dasharray: 4 3; }
  .node.sel rect.box { stroke: var(--focus); stroke-width: 3; }
  .edge { fill: none; stroke: var(--edge); opacity: .55; }
  .edge.cycle { stroke: var(--cycle); opacity: .9; }
  .edge.violation { stroke: var(--violation); opacity: .9; }
  .edge.semantic { stroke-dasharray: 5 4; }
  .edge.out { stroke: var(--out); opacity: 1; }
  .edge.in { stroke: var(--in); opacity: 1; }
  .dim { opacity: .12 !important; }
  .problems .edge:not(.cycle):not(.violation) { opacity: .08; }
  #panel { position: fixed; z-index: 4; right: 12px; top: 64px; bottom: 12px; width: 340px; max-width: calc(100% - 24px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 18px; overflow: auto;
    box-shadow: 0 8px 30px rgba(0,0,0,.12); display: none; }
  #panel.open { display: block; }
  #panel h2 { margin: 0 28px 2px 0; font-size: 16px; word-break: break-all; }
  #panel .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; overflow-wrap: anywhere; }
  #panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }
  #panel .close { position: absolute; top: 10px; right: 10px; }
  .dep { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; margin-bottom: 6px; cursor: pointer; }
  .dep:hover { border-color: var(--ink); }
  .dep .name { font-weight: 600; word-break: break-all; }
  .dep .why { color: var(--muted); font-size: 11.5px; margin-top: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  .tag { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 999px; margin-left: 5px; vertical-align: 1px; background: var(--chip); }
  .tag.cycle { color: var(--cycle); } .tag.violation { color: var(--violation); }
  #legend { position: fixed; z-index: 2; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; font-size: 12px; max-width: calc(100% - 24px); }
  #legend .row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  #legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
  #legend b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  #empty { position: fixed; inset: 0; display: none; place-items: center; color: var(--muted); }
  @media (max-width: 640px) {
    #panel { left: 8px; right: 8px; width: auto; top: auto; bottom: 8px; max-height: 55%; }
    #legend { display: none; }
    #stats { display: none; }
  }
</style>
</head>
<body>
<div id="bar">
  <h1>edict <span id="crate"></span></h1>
  <div class="seg" id="views">
    <button data-view="top">Modules</button>
    <button data-view="file">Files</button>
  </div>
  <button class="btn" id="problems" title="Fade edges that break no law">Problems only</button>
  <button class="btn" id="fit">Fit</button>
  <input id="search" placeholder="Search modules…" autocomplete="off">
  <span id="stats"></span>
</div>
<svg id="svg"><defs id="defs"></defs><g id="world"><g id="edges"></g><g id="nodes"></g></g></svg>
<div id="empty">No modules to show.</div>
<aside id="panel"><button class="btn close" id="close">✕</button><div id="panelBody"></div></aside>
<div id="legend"><div class="row" id="legendRow"></div></div>

<script>
const DATA = /*__EDICT_DATA__*/null;
const PALETTE = ["#4f7cff", "#16a37f", "#c25ad8", "#e0742d", "#2aa3c4", "#b8a019", "#d4507a", "#6b7b8c"];
const ROW_GAP = 130, COL_GAP = 28, NODE_H = 40, MAX_ROW = 16;

const svg = document.getElementById("svg"), world = document.getElementById("world");
const gEdges = document.getElementById("edges"), gNodes = document.getElementById("nodes");
const panel = document.getElementById("panel"), panelBody = document.getElementById("panelBody");
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const layerColor = (i) => (i === null || i === undefined) ? "transparent" : PALETTE[i % PALETTE.length];

let view = DATA.views.top.nodes.length > 2 ? "top" : "file";
let state = null;          // { nodes, edges, pos }
let selected = null;
let cam = { x: 0, y: 0, k: 1 };

document.getElementById("crate").textContent = DATA.crate;

// ---------- layout: layered, ordered by barycenter ----------
function layout(v) {
  const nodes = v.nodes.map((n) => ({ ...n }));
  const deps = nodes.map(() => []), users = nodes.map(() => []);
  for (const e of v.edges) { deps[e.from].push(e.to); users[e.to].push(e.from); }

  // Rows by level; very wide rows wrap into sub-rows so the page stays scrollable.
  const byLevel = new Map();
  for (const n of nodes) { if (!byLevel.has(n.level)) byLevel.set(n.level, []); byLevel.get(n.level).push(n); }
  const levels = [...byLevel.keys()].sort((a, b) => b - a); // top row = highest level
  let rows = [];
  for (const L of levels) {
    const list = byLevel.get(L).sort((a, b) => a.name.localeCompare(b.name));
    for (let i = 0; i < list.length; i += MAX_ROW) rows.push(list.slice(i, i + MAX_ROW));
  }

  const width = (n) => Math.max(90, Math.min(260, 20 + Math.max(7.1 * n.name.length, 6.2 * subtitle(n).length)));
  const place = () => {
    rows.forEach((row, r) => {
      const total = row.reduce((s, n) => s + width(n), 0) + COL_GAP * (row.length - 1);
      let x = -total / 2;
      row.forEach((n) => { n.w = width(n); n.x = x + n.w / 2; n.y = r * ROW_GAP; x += n.w + COL_GAP; });
    });
  };
  place();
  const bary = (n, nbrs) => {
    const xs = nbrs.map((i) => nodes[i].x);
    return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : n.x;
  };
  for (let it = 0; it < 8; it++) {
    const order = it % 2 === 0 ? rows : [...rows].reverse();
    for (const row of order) {
      row.forEach((n) => { n.b = bary(n, [...deps[n.id], ...users[n.id]]); });
      row.sort((a, b) => a.b - b.b);
    }
    place();
  }
  return { nodes, edges: v.edges };
}

function subtitle(n) { return (n.layer !== null ? DATA.layers[n.layer].name + " · " : "") + n.lines + " lines"; }

// ---------- render ----------
function render() {
  const v = DATA.views[view];
  state = layout(v);
  gEdges.replaceChildren(); gNodes.replaceChildren();
  document.getElementById("empty").style.display = state.nodes.length ? "none" : "grid";

  const defs = document.getElementById("defs");
  defs.replaceChildren();
  for (const [id, color] of [["a-edge", css("--edge")], ["a-cycle", css("--cycle")], ["a-violation", css("--violation")], ["a-out", css("--out")], ["a-in", css("--in")]]) {
    // Fixed-size arrowheads: by default markers scale with stroke width.
    const m = el("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 9, markerHeight: 9, markerUnits: "userSpaceOnUse", orient: "auto-start-reverse" }, defs);
    el("path", { d: "M0,0 L10,5 L0,10 z", fill: color }, m);
  }

  state.edges.forEach((e, i) => {
    const a = state.nodes[e.from], b = state.nodes[e.to];
    let d;
    if (b.y > a.y) {          // normal: dependency is lower
      const sy = a.y + NODE_H / 2, ty = b.y - NODE_H / 2, dy = (ty - sy) / 2;
      d = `M${a.x},${sy} C${a.x},${sy + dy} ${b.x},${ty - dy} ${b.x},${ty}`;
    } else {                  // same row or upward: only cycles do this
      if (b.y === a.y) {      // same row: rightward arcs go over, leftward under, so pairs don't overlap
        const up = a.x < b.x ? -1 : 1;
        const y = a.y + up * NODE_H / 2, h = up * (40 + Math.min(20, Math.abs(b.x - a.x) / 20));
        d = `M${a.x},${y} C${a.x},${y + h} ${b.x},${y + h} ${b.x},${y}`;
      } else {                // upward: swing out to the side
        const sy = a.y - NODE_H / 2, ty = b.y + NODE_H / 2, side = (a.x <= b.x ? 1 : -1) * 60;
        d = `M${a.x},${sy} C${a.x + side},${sy - 60} ${b.x + side},${ty + 60} ${b.x},${ty}`;
      }
    }
    const cls = ["edge", e.cycle ? "cycle" : "", e.layerViolation ? "violation" : "", e.semanticOnly ? "semantic" : ""].join(" ");
    const marker = e.cycle ? "a-cycle" : e.layerViolation ? "a-violation" : "a-edge";
    const p = el("path", { d, class: cls, "stroke-width": Math.min(6, 1 + Math.log2(e.count)).toFixed(2), "marker-end": `url(#${marker})`, "data-i": i }, gEdges);
    e.el = p; e.marker = marker;
  });

  for (const n of state.nodes) {
    const g = el("g", { class: "node" + (n.cycle ? " cycle" : ""), transform: `translate(${n.x - n.w / 2},${n.y - NODE_H / 2})`, "data-id": n.id }, gNodes);
    el("rect", { class: "box", width: n.w, height: NODE_H }, g);
    el("rect", { class: "band", width: 5, height: NODE_H - 8, x: 0, y: 4, fill: layerColor(n.layer) }, g);
    const t = el("text", { x: 12, y: 17 }, g); t.textContent = clip(n.name, n.w);
    const s = el("text", { x: 12, y: 31, class: "sub" }, g);
    s.textContent = subtitle(n);
    n.el = g;
  }

  const problems = state.edges.filter((e) => e.cycle || e.layerViolation).length;
  document.getElementById("stats").textContent =
    `${state.nodes.length} ${view === "top" ? "modules" : "files"} · ${state.edges.length} deps · ${problems} breaking a law`;
  for (const b of document.querySelectorAll("#views button")) b.classList.toggle("on", b.dataset.view === view);
  renderLegend();
  selected = null; panel.classList.remove("open");
  fit();
}

function clip(s, w) {
  const max = Math.floor((w - 18) / 7.1);
  return s.length > max ? "…" + s.slice(s.length - max + 1) : s;
}

function renderLegend() {
  const row = document.getElementById("legendRow");
  row.innerHTML = "";
  const add = (html) => { const s = document.createElement("span"); s.innerHTML = html; row.appendChild(s); };
  DATA.layers.forEach((l) => add(`<b style="background:${layerColor(l.index)}"></b>${l.name}${l.pure ? " (pure)" : ""}`));
  add(`<i style="border-color:var(--cycle)"></i>cycle`);
  if (DATA.layers.length) add(`<i style="border-color:var(--violation)"></i>layer violation`);
  if (DATA.views[view].edges.some((e) => e.semanticOnly)) add(`<i style="border-color:var(--edge);border-top-style:dashed"></i>only rust-analyzer`);
  add(`<span style="color:var(--muted)">arrows point at what's depended on</span>`);
}

// ---------- camera ----------
function apply() { world.setAttribute("transform", `translate(${cam.x},${cam.y}) scale(${cam.k})`); }
function fit() {
  if (!state.nodes.length) return;
  const xs = state.nodes.flatMap((n) => [n.x - n.w / 2, n.x + n.w / 2]), ys = state.nodes.flatMap((n) => [n.y - NODE_H, n.y + NODE_H]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const top = document.getElementById("bar").offsetHeight + 10;
  const W = innerWidth, H = innerHeight - top;
  cam.k = Math.min(1.4, Math.max(0.08, Math.min(W / (x1 - x0 + 80), H / (y1 - y0 + 80))));
  cam.x = W / 2 - cam.k * (x0 + x1) / 2;
  cam.y = top + H / 2 - cam.k * (y0 + y1) / 2;
  apply();
}
function centerOn(n) {
  const top = document.getElementById("bar").offsetHeight;
  cam.k = Math.max(cam.k, 0.9);
  const narrow = innerWidth <= 640;
  const cx = narrow ? innerWidth / 2 : (innerWidth - (panel.classList.contains("open") ? 360 : 0)) / 2;
  const cy = narrow ? top + (innerHeight * 0.45 - top) / 2 : innerHeight / 2;
  cam.x = cx - cam.k * n.x; cam.y = cy - cam.k * n.y;
  apply();
}
function zoomAt(px, py, factor) {
  const k = Math.min(4, Math.max(0.05, cam.k * factor));
  cam.x = px - (px - cam.x) * (k / cam.k); cam.y = py - (py - cam.y) * (k / cam.k); cam.k = k; apply();
}

svg.addEventListener("wheel", (ev) => { ev.preventDefault(); zoomAt(ev.clientX, ev.clientY, Math.exp(-ev.deltaY * 0.0015)); }, { passive: false });

const pointers = new Map();
let drag = null, pinch = null, moved = false;
svg.addEventListener("pointerdown", (ev) => {
  svg.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  moved = false;
  if (pointers.size === 1) { drag = { x: ev.clientX, y: ev.clientY, cx: cam.x, cy: cam.y }; svg.classList.add("dragging"); }
  if (pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    pinch = { d: Math.hypot(p.x - q.x, p.y - q.y), k: cam.k }; drag = null;
  }
});
svg.addEventListener("pointermove", (ev) => {
  if (!pointers.has(ev.pointerId)) return;
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pinch && pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    const d = Math.hypot(p.x - q.x, p.y - q.y);
    zoomAt((p.x + q.x) / 2, (p.y + q.y) / 2, (pinch.k * d / pinch.d) / cam.k);
    moved = true;
  } else if (drag) {
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    cam.x = drag.cx + dx; cam.y = drag.cy + dy; apply();
  }
});
const release = (ev) => {
  const wasTap = !moved && pointers.size === 1;
  pointers.delete(ev.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) { drag = null; svg.classList.remove("dragging"); }
  if (wasTap && ev.type === "pointerup") {
    const hit = document.elementFromPoint(ev.clientX, ev.clientY);
    const g = hit && hit.closest && hit.closest(".node");
    if (g) select(+g.dataset.id); else select(null);
  }
};
svg.addEventListener("pointerup", release);
svg.addEventListener("pointercancel", release);

// ---------- selection & panel ----------
function select(id, recenter = false) {
  selected = id;
  for (const n of state.nodes) n.el.classList.remove("sel", "dim");
  for (const e of state.edges) { e.el.classList.remove("out", "in", "dim"); e.el.setAttribute("marker-end", `url(#${e.marker})`); }
  if (id === null) { panel.classList.remove("open"); return; }

  const n = state.nodes[id];
  const outs = state.edges.filter((e) => e.from === id), ins = state.edges.filter((e) => e.to === id);
  const near = new Set([id, ...outs.map((e) => e.to), ...ins.map((e) => e.from)]);
  for (const m of state.nodes) if (!near.has(m.id)) m.el.classList.add("dim");
  for (const e of state.edges) {
    if (e.from === id) { e.el.classList.add("out"); e.el.setAttribute("marker-end", "url(#a-out)"); gEdges.appendChild(e.el); }
    else if (e.to === id) { e.el.classList.add("in"); e.el.setAttribute("marker-end", "url(#a-in)"); gEdges.appendChild(e.el); }
    else e.el.classList.add("dim");
  }
  n.el.classList.add("sel");

  const tags = (e) => (e.cycle ? `<span class="tag cycle">cycle</span>` : "") + (e.layerViolation ? `<span class="tag violation">layer violation</span>` : "") + (e.semanticOnly ? `<span class="tag">rust-analyzer only</span>` : "");
  const card = (e, other) => {
    const why = e.samples.map((s) => `${esc(s.path)}${s.uses > 1 ? ` ×${s.uses}` : ""} <span style="opacity:.7">${esc(s.file)}:${s.line}</span>`).join("<br>");
    const more = e.distinct > e.samples.length ? `<br>…and ${e.distinct - e.samples.length} more` : "";
    return `<div class="dep" data-go="${other.id}"><div class="name">${esc(other.name)} <span class="tag">${e.count}</span>${tags(e)}</div><div class="why">${why}${more}</div></div>`;
  };
  const layer = n.layer !== null ? `${DATA.layers[n.layer].name}${DATA.layers[n.layer].pure ? " (pure)" : ""}` : "no layer";
  panelBody.innerHTML = `
    <h2>${esc(n.name)}</h2>
    <div class="meta">${esc(n.file)} · ${n.lines} lines · ${esc(layer)}${n.cycle ? ' · <span style="color:var(--cycle)">in a cycle</span>' : ""}</div>
    <h3 style="color:var(--out)">Depends on (${outs.length})</h3>
    ${outs.sort((a, b) => b.count - a.count).map((e) => card(e, state.nodes[e.to])).join("") || '<div class="meta">Nothing in this crate.</div>'}
    <h3 style="color:var(--in)">Used by (${ins.length})</h3>
    ${ins.sort((a, b) => b.count - a.count).map((e) => card(e, state.nodes[e.from])).join("") || '<div class="meta">Nothing in this crate.</div>'}`;
  panel.classList.add("open");
  panel.scrollTop = 0;
  for (const d of panelBody.querySelectorAll("[data-go]")) d.addEventListener("click", () => select(+d.dataset.go, true));
  if (recenter) centerOn(n);
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// ---------- controls ----------
document.getElementById("close").addEventListener("click", () => select(null));
for (const b of document.querySelectorAll("#views button")) b.addEventListener("click", () => { view = b.dataset.view; render(); });
document.getElementById("fit").addEventListener("click", fit);
const problemsBtn = document.getElementById("problems");
problemsBtn.addEventListener("click", () => { svg.classList.toggle("problems"); problemsBtn.classList.toggle("on"); });
const search = document.getElementById("search");
search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  for (const n of state.nodes) n.el.classList.toggle("match", !!q && n.name.toLowerCase().includes(q));
});
search.addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter") return;
  const q = search.value.trim().toLowerCase();
  const hit = state.nodes.find((n) => n.name.toLowerCase() === q) || state.nodes.find((n) => n.name.toLowerCase().includes(q));
  if (hit) { select(hit.id, true); search.blur(); }
});
addEventListener("keydown", (ev) => { if (ev.key === "Escape") select(null); });
addEventListener("resize", () => fit());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);

render();
</script>
</body>
</html>
