[package]
name = "cargo-edict"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic architecture laws for Rust crates: no module cycles, layered dependencies, facades, a pure core, no global mutable state."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["architecture", "lint", "cargo-subcommand", "modules", "dependencies"]
categories = ["development-tools", "development-tools::cargo-plugins"]
exclude = ["tests", ".github"]
repository = "https://github.com/arcasoy/edict"

[[bin]]
name = "cargo-edict"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
protobuf = "3.7.2"
quote = "1.0.47"
scip = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
toml = "1.2.1"
